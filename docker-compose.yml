services:
  db:
    image: postgres:16-alpine
    container_name: ustazon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ustazon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" mapping on purpose: the backend reaches Postgres over the
    # internal docker network at db:5432. Publishing 5432 to the host would
    # expose the database to anyone who can reach this machine. If you need
    # host access for local debugging, bind to loopback only, e.g.:
    #   ports:
    #     - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      dockerfile: Dockerfile
    container_name: ustazon_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-ustazon}
      # SECRET_KEY, BACKEND_CORS_ORIGINS, SMS_ENABLED, MOBIZON_API_KEY and
      # MOBIZON_API_URL are loaded from .env via env_file above. Do not
      # hardcode secrets here - this file is committed to git.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
