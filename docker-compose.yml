services:
  db:
    image: postgres:16-alpine
    container_name: ustazon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ustazon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      dockerfile: Dockerfile
    container_name: ustazon_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ustazon
      SECRET_KEY: your-super-secret-key-change-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:3000"]'
      SMS_ENABLED: "true"
      MOBIZON_API_KEY: "kz7b484472b8821e192ff2a809043cf21ab9430acddd2a765c4bc96bc7f7d86edd4633"
      MOBIZON_API_URL: "https://api.mobizon.kz/service"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
