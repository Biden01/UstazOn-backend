[tool.poetry]
name = "backend"
version = "0.1.0"
description = "UstazOn Backend API"
authors = ["Erasyl <erasylbidan@mail.ru>"]
package-mode = false

[project]
name = "backend"
version = "0.1.0"
description = "UstazOn Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "greenlet>=3.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "sqladmin (>=0.22.0,<0.23.0)",
    "google-genai>=0.2.0",
    "openai>=1.54.0",
    "fpdf (>=1.7.2,<2.0.0)",
    "fpdf2 (>=2.8.5,<3.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "manim (>=0.19.1,<0.20.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "redis>=5.0.0",
    "pymupdf>=1.24.0",

]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
